    properties:
      embed:
        allOf:
        - $ref: '#/definitions/swagger.swaggerWecomAuthorizeEmbed'
        description: 内嵌二维码渲染参数，SSO 与直连模式返回，其余场景缺失表示仅支持整页跳转
      url:
        description: 企业微信扫码页跳转地址（整页跳转降级用）
        example: https://login.work.weixin.qq.com/wwlogin/sso/login?login_type=CorpApp&appid=ww123
