      description: 获取审计日志；导入类事件的目标仅返回前两个名称，完整清单通过 targetTitle 返回供悬浮提示
      parameters:
      - description: 返回条数；默认返回全部
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/swagger.swaggerAuditHistoryResponse'
      security:
      - BearerAuth: []
      summary: 获取审计日志
      tags:
      - 审计日志
  /api/history/clear:
    post:
      consumes:
      - application/json
      description: 按前端筛选结果批量清空审计日志；清空成功后自动补记一条「清空审计日志」审计事件（归属「审计日志」模块，目标为清除条数）
      parameters:
      - description: 待清空的审计日志编号清单
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/swagger.swaggerHistoryClearRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/swagger.swaggerHistoryClearResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/swagger.swaggerErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/swagger.swaggerErrorResponse'
      security:
      - BearerAuth: []
      summary: 清空审计日志
      tags:
      - 审计日志
  /api/history/export:
    post:
      consumes:
      - application/json
      description: 各页面导出完成后回写一条审计，模块取值 hosts/tasks/executions/alerts/audit
      parameters:
      - description: 导出模块与记录条数
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/swagger.swaggerHistoryExportRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/swagger.swaggerOKResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/swagger.swaggerErrorResponse'
      security:
      - BearerAuth: []
      summary: 记录数据导出
      tags:
      - 审计日志
  /api/ingest/report:
    post:
      consumes:
      - application/json
      description: 接收 Agent 上报的主机、任务与执行记录，按 task+session 幂等更新；协议见 docs/agent-protocol.md
      parameters:
      - description: Agent 访问令牌，启用校验时必填
        in: header
        name: X-Agent-Token
        type: string
      - description: 主机、任务与执行记录
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/swagger.swaggerGenericObject'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/swagger.swaggerGenericObject'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/swagger.swaggerErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/swagger.swaggerErrorResponse'
      summary: Agent 上报数据
      tags:
      - Agent 通道
