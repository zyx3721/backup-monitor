      auth_mode:
        description: 认证方式：direct=直连企业微信，sso=统一认证中心
        example: direct
        type: string
      callback_path:
        description: iframe 内扫码确认后的回跳路径：直连模式 /wecom-qr-callback，统一认证中心模式 /login
        example: /wecom-qr-callback
        type: string
      iframe_url:
        description: 内嵌 iframe 加载的扫码页地址：直连模式为企微登录页（回跳 /wecom-qr-callback），SSO 模式为认证中心入口
        example: https://login.work.weixin.qq.com/wwlogin/sso/login?login_type=CorpApp&appid=ww123&redirect_uri=https%3A%2F%2Fexample.com%2Fwecom-qr-callback
        type: string
      state:
        description: 直连模式签发的防伪状态串，SSO 模式为空
        example: eyJwIjoibG9naW4iLCJlIjoxNzI2LCJuIjoiYTFiMmMzIn0.5f8a
        type: string
    type: object
