        example: abc123
        type: string
      state:
        description: 发起跳转时签发的防伪状态串
        example: eyJwIjoibG9naW4iLCJlIjoxNzI2LCJuIjoiYTFiMmMzIn0.5f8a
        type: string
    type: object
  swagger.swaggerWecomProvider:
    properties:
      config:
        allOf:
        - $ref: '#/definitions/swagger.swaggerWecomProviderConfig'
        description: 配置项
      enabled:
        description: 是否启用
        example: true
        type: boolean
      id:
        description: 提供者标识
        example: wecom
        type: string
      name:
        description: 显示名称
        example: 企业微信
        type: string
      type:
        description: 提供者类型
        example: wecom
        type: string
      updatedAt:
        description: 更新时间
        example: "2026-09-18 12:00:00"
        type: string
    type: object
  swagger.swaggerWecomProviderConfig:
    properties:
      agentid:
        description: 应用 AgentID
        example: "1000002"
        type: string
      authMode:
        description: 认证方式：direct=直连企业微信，sso=统一认证中心
        example: direct
        type: string
      corpid:
        description: 企业 ID（corpid）
        example: ww1234567890
        type: string
      hasSecret:
        description: 是否已配置应用 Secret
        example: true
        type: boolean
      hasSsoAppSecret:
        description: 是否已配置应用密钥（SSO 模式）
        example: true
        type: boolean
      redirectPrefix:
        description: 回调地址前缀（可选，留空时按当前访问地址推断，不含 /login 路径）
        example: https://example.com
        type: string
      ssoAppID:
        description: 统一认证中心应用标识（SSO 模式）
        example: wecom-app
        type: string
      ssoBaseUrl:
        description: 统一认证中心地址（SSO 模式）
        example: https://auth.example.com
        type: string
    type: object
  swagger.swaggerWecomProviderRequest:
    properties:
      clearConfig:
        description: 是否清空已存 Secret
        example: false
        type: boolean
      config:
        allOf:
        - $ref: '#/definitions/swagger.swaggerWecomProviderSaveConfig'
        description: 配置项（secret 仅在更换时传入）
      enabled:
        description: 是否启用
        example: true
        type: boolean
      name:
        description: 显示名称
        example: 企业微信
        type: string
    type: object
  swagger.swaggerWecomProviderSaveConfig:
    properties:
      agentid:
        description: 应用 AgentID
        example: "1000002"
        type: string
      authMode:
        description: 认证方式：direct=直连企业微信，sso=统一认证中心
        example: direct
        type: string
      corpid:
        description: 企业 ID（corpid）
        example: ww1234567890
        type: string
      redirectPrefix:
        description: 回调地址前缀（可选，留空时按当前访问地址推断，不含 /login 路径）
        example: https://example.com
        type: string
      secret:
        description: 应用 Secret
        example: j8Kx2pQ
        type: string
      ssoAppID:
        description: 统一认证中心应用标识（SSO 模式）
        example: wecom-app
        type: string
      ssoAppSecret:
        description: 应用密钥（SSO 模式，仅在更换时传入）
        example: 9f2c1a3e4b5d6f708192a3b4c5d6e7f0
        type: string
      ssoBaseUrl:
        description: 统一认证中心地址（SSO 模式）
        example: https://auth.example.com
        type: string
    type: object
  swagger.swaggerWecomSSORequest:
    properties:
      ticket:
        description: 统一认证中心回跳携带的一次性登录凭证
        example: 9f2c1a3e4b5d6f708192a3b4c5d6e7f0
        type: string
    type: object
info:
  contact: {}
  description: Backup Monitor 通用前后端模板后端 API 文档。除登录、公开品牌与健康检查外，接口默认需要 Bearer Token。
  title: Backup Monitor API
  version: 1.0.0
paths:
  /api/agent/binary/latest:
    get:
      description: 按平台、架构与系统版本选择槽位，返回对应安装包的版本号、大小、SHA-256 与通道
      parameters:
      - description: 平台，取值 linux 或 windows
        in: query
        name: platform
        required: true
        type: string
      - description: CPU 架构，取值 amd64 或 arm64；省略时按 amd64 处理
        in: query
        name: arch
        type: string
      - description: Windows 构建号，用于自动选包
        in: query
        name: osBuild
        type: integer
      - description: Agent 访问令牌，启用校验时必填
        in: header
        name: X-Agent-Token
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/swagger.swaggerAgentBinaryLatestResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/swagger.swaggerErrorResponse'
      summary: 查询最新 Agent 版本
      tags:
      - Agent 通道
  /api/agent/config:
    get:
      description: 返回全局参数、采集配置与二进制更新信息供 Agent 应用
      parameters:
      - description: 主机名
        in: query
        name: hostname
        required: true
        type: string
      - description: 平台，取值 linux 或 windows
        in: query
        name: platform
        type: string
      - description: Agent 访问令牌，启用校验时必填
        in: header
        name: X-Agent-Token
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/swagger.swaggerGenericObject'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/swagger.swaggerErrorResponse'
      summary: 拉取 Agent 配置
      tags:
      - Agent 通道
  /api/agent/download:
    get:
      description: 下载匹配主机架构与系统版本的托管 Agent 二进制；精确指定 arch+variant 时取对应槽位，否则按 osBuild
        自动选包
      parameters:
      - description: 平台，取值 linux 或 windows
        in: query
        name: platform
        required: true
        type: string
      - description: CPU 架构，取值 amd64 或 arm64；省略时按 osBuild 自动选包
        in: query
        name: arch
        type: string
      - description: 通道，取值 standard 或 legacy；与 arch 同时指定时精确取槽位
        in: query
        name: variant
        type: string
      - description: Windows 构建号，用于在未精确指定槽位时自动选包
        in: query
        name: osBuild
        type: integer
      - description: Agent 访问令牌，启用校验时必填
        in: header
        name: X-Agent-Token
        type: string
      produces:
      - application/octet-stream
      responses:
        "200":
          description: 二进制文件
          schema:
            type: file
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/swagger.swaggerErrorResponse'
      summary: 下载托管 Agent 二进制
      tags:
      - Agent 通道
  /api/agent/ws:
    get:
      description: 建立 WebSocket 长连接，承载心跳、配置变更与 set_cron/update 命令回执
      parameters:
      - description: 主机名
        in: query
        name: hostname
        required: true
        type: string
      - description: 稳定机器标识
        in: query
        name: nodeId
        type: string
      - description: 平台，取值 linux 或 windows
        in: query
        name: platform
        type: string
      - description: Agent 访问令牌，启用校验时必填
        in: header
        name: X-Agent-Token
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 协议升级为 WebSocket
          schema:
            type: string
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/swagger.swaggerErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/swagger.swaggerErrorResponse'
      summary: Agent 心跳长连接
      tags:
      - Agent 通道
  /api/auth/change-password:
    post:
      consumes:
      - application/json
      description: 修改当前登录用户的密码，旧密码错误返回 400，成功后需重新登录
      parameters:
      - description: 密码修改请求
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/swagger.changePasswordBody'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/swagger.swaggerMessageResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/swagger.swaggerErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/swagger.swaggerErrorResponse'
      security:
      - BearerAuth: []
      summary: 修改当前用户密码
      tags:
      - 认证
  /api/auth/login:
    post:
      consumes:
      - application/json
      description: 用户登录，支持本地密码与 AD/LDAP 两种方式，成功返回令牌与用户信息；同一账号密码连续错误达到阈值后锁定，锁定期间即使密码正确也返回
        429 与剩余等待分钟（内置 admin 不受限，企业微信扫码不涉及）
      parameters:
      - description: 登录信息
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/swagger.authLoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/swagger.authLoginResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/swagger.swaggerErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/swagger.swaggerErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/swagger.swaggerErrorResponse'
      summary: 用户登录
      tags:
      - 认证
  /api/auth/logout:
    post:
      description: 退出当前会话，并写入用户注销审计
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/swagger.swaggerOKResponse'
      security:
      - BearerAuth: []
      summary: 登出当前会话
      tags:
      - 认证
  /api/auth/me:
    get:
      description: 获取当前登录用户的资料、直接角色、有效角色与权限清单
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/swagger.swaggerGenericObject'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/swagger.swaggerErrorResponse'
      security:
      - BearerAuth: []
      summary: 获取当前用户
      tags:
      - 认证
  /api/auth/password-reset/captcha:
    get:
      description: 获取找回密码图形验证码，无需认证
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/swagger.swaggerPasswordResetCaptchaResponse'
      summary: 获取找回密码图形验证码
      tags:
      - 认证
  /api/auth/password-reset/confirm:
    post:
      consumes:
      - application/json
      description: 凭邮箱验证码完成找回密码，重置账号密码并写入审计
      parameters:
      - description: 找回密码确认
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/swagger.swaggerPasswordResetConfirmRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/swagger.swaggerMessageResponse'
      summary: 确认找回密码
      tags:
      - 认证
  /api/auth/password-reset/send:
    post:
      consumes:
      - application/json
      description: 向校验通过的邮箱发送找回密码验证码，受发送冷却与限流窗口约束
      parameters:
      - description: 找回密码验证码发送
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/swagger.swaggerPasswordResetSendRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/swagger.swaggerPasswordResetSendResponse'
      summary: 发送找回密码验证码
      tags:
      - 认证
  /api/auth/password-reset/verify:
    post:
      consumes:
      - application/json
      description: 校验用户名与图形验证码，换取找回密码流程令牌
      parameters:
      - description: 找回密码身份校验
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/swagger.swaggerPasswordResetVerifyRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/swagger.swaggerPasswordResetVerifyResponse'
      summary: 校验找回密码身份
      tags:
      - 认证
  /api/auth/providers:
    get:
      description: 获取登录页可用的认证方式与找回密码开关，无需认证
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/swagger.swaggerPublicAuthProvidersResponse'
      summary: 获取公开认证方式
      tags:
      - 认证
  /api/auth/wecom/authorize:
    get:
      description: 生成企业微信 Web 扫码登录页地址（含防伪 state）与内嵌二维码渲染参数（iframe_url、callback_path）；直连模式内嵌扫码回跳
        /wecom-qr-callback，统一认证中心模式回跳 /login。登录页默认内嵌渲染二维码，配置异常时自动回退整页跳转；需已启用企业微信认证，无需认证
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/swagger.swaggerWecomAuthorizeResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/swagger.swaggerErrorResponse'
      summary: 获取企业微信扫码登录地址
      tags:
      - 认证
  /api/auth/wecom/bind:
    delete:
      description: 解除当前登录用户的企业微信绑定
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/swagger.swaggerOKResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/swagger.swaggerErrorResponse'
      security:
      - BearerAuth: []
      summary: 解绑企业微信账号
      tags:
      - 认证
    post:
      consumes:
      - application/json
      description: 校验绑定 state 后用授权码换取企业微信成员 userid，与当前用户建立绑定；该企微已绑定其他用户时返回 409
      parameters:
      - description: 扫码回调载荷
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/swagger.swaggerWecomCallbackRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/swagger.swaggerWecomBindResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/swagger.swaggerErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/swagger.swaggerErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/swagger.swaggerErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/swagger.swaggerErrorResponse'
      security:
      - BearerAuth: []
      summary: 绑定企业微信账号
      tags:
      - 认证
  /api/auth/wecom/bind-url:
    get:
      description: 为当前登录用户生成企业微信绑定扫码地址，state 绑定当前用户；需已启用企业微信认证
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/swagger.swaggerWecomAuthorizeResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/swagger.swaggerErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/swagger.swaggerErrorResponse'
      security:
      - BearerAuth: []
      summary: 获取企业微信绑定扫码地址
      tags:
      - 认证
  /api/auth/wecom/callback:
    post:
      consumes:
      - application/json
      description: 校验 state 后用授权码换取企业微信成员身份，按绑定关系登录并返回令牌与用户信息；未绑定时返回 401
      parameters:
      - description: 扫码回调载荷
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/swagger.swaggerWecomCallbackRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/swagger.authLoginResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/swagger.swaggerErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/swagger.swaggerErrorResponse'
      summary: 企业微信扫码登录回调
      tags:
      - 认证
  /api/auth/wecom/sso/bind:
    post:
      consumes:
      - application/json
      description: 企业微信统一认证（SSO）模式：校验认证中心一次性 ticket 后与当前登录用户建立绑定；该企微已绑定其他用户时返回 409
      parameters:
      - description: 认证中心回跳凭证
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/swagger.swaggerWecomSSORequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/swagger.swaggerWecomBindResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/swagger.swaggerErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/swagger.swaggerErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/swagger.swaggerErrorResponse'
      security:
      - BearerAuth: []
      summary: 统一认证中心扫码绑定
      tags:
      - 认证
  /api/auth/wecom/sso/callback:
    post:
      consumes:
      - application/json
      description: 企业微信统一认证（SSO）模式：校验认证中心回跳的一次性 ticket 后按绑定关系登录并返回令牌与用户信息；需已启用统一认证模式
      parameters:
      - description: 认证中心回跳凭证
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/swagger.swaggerWecomSSORequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/swagger.authLoginResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/swagger.swaggerErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/swagger.swaggerErrorResponse'
      summary: 统一认证中心扫码登录回调
      tags:
      - 认证
  /api/backup/agent-binaries:
    get:
      description: 返回各槽位（平台 + 架构 + 通道）已托管的版本、Go 版本、大小与 SHA-256（权限 backup.agents.read）
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/swagger.swaggerAgentBinaryMeta'
            type: array
      security:
      - BearerAuth: []
      summary: 获取已托管 Agent 二进制
      tags:
      - Agent 管理
  /api/backup/agent-binary:
    post:
      consumes:
      - application/octet-stream
      description: 上传指定平台与通道的 Agent 二进制并写入审计，支持 amd64 与 arm64（服务端按文件头解析架构、按 buildinfo
        读取 Go 版本），单次不超过 128MB（权限 backup.agents.manage）
      parameters:
      - description: 平台，取值 linux 或 windows
        in: query
        name: platform
        required: true
        type: string
      - description: 通道，取值 standard 或 legacy；缺省按 Go 版本推导（Windows amd64 且 Go < 1.21
          归入 legacy）
        in: query
        name: variant
        type: string
      - description: 版本号
        in: query
        name: version
        required: true
        type: string
      - description: 二进制原始字节（服务端校验 ELF/PE）
        in: body
        name: file
        required: true
        schema:
          type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/swagger.swaggerAgentBinaryMeta'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/swagger.swaggerErrorResponse'
      security:
      - BearerAuth: []
      summary: 上传 Agent 二进制
      tags:
      - Agent 管理
  /api/backup/agent-update/push:
    put:
      consumes:
      - application/json
      description: 按平台与 IP 条件逐台选择匹配的槽位（架构 + Windows 版本）下发自更新并写入审计（权限 backup.agents.manage）
      parameters:
      - description: 平台与目标主机（全部或 IP 条件）
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/swagger.swaggerAgentBinaryPushRequest'
