  /download/backup-agent:
    get:
      description: 无需令牌的公开下载入口，按平台、架构与系统版本选择槽位，供首次部署直接拉取托管二进制
      parameters:
      - description: 平台，取值 linux 或 windows
        in: query
        name: platform
        required: true
        type: string
      - description: CPU 架构，取值 amd64 或 arm64
        in: query
        name: arch
        type: string
      - description: 通道，取值 standard 或 legacy
        in: query
        name: variant
        type: string
      - description: Windows 构建号，用于自动选包
        in: query
        name: osBuild
        type: integer
      produces:
      - application/octet-stream
      responses:
        "200":
          description: 二进制文件，响应头含版本与 SHA-256
          schema:
            type: file
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/swagger.swaggerErrorResponse'
